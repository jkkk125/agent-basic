<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>炼厂 92# / 95# 汽油价格走势</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f6f8;
    color: #1f2329;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 20px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #8a8f99; font-size: 13px; margin-bottom: 24px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card { background: #fff; border-radius: 10px; padding: 16px 18px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .card .label { font-size: 12px; color: #8a8f99; }
  .card .value { font-size: 24px; font-weight: 600; margin-top: 6px; }
  .card .delta { font-size: 13px; margin-top: 4px; }
  .up { color: #e5484d; }
  .down { color: #30a46c; }
  .panel { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 1px 2px rgba(0,0,0,.04); margin-bottom: 20px; }
  .panel h2 { font-size: 15px; margin: 0 0 14px; }
  .chart-box { position: relative; height: 420px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid #f0f1f3; }
  th:first-child, td:first-child { text-align: left; }
  th { color: #8a8f99; font-weight: 500; background: #fafbfc; position: sticky; top: 0; }
  .table-box { max-height: 460px; overflow: auto; }
  .note { font-size: 12px; color: #8a8f99; line-height: 1.7; margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>炼厂 92# / 95# 汽油价格走势</h1>
  <div class="sub">数据来源：炼厂咨询 · 单位：元/吨 · 2026.10.03 – 2026.11.11</div>

  <div class="cards" id="cards"></div>

  <div class="panel">
    <h2>价格走势</h2>
    <div class="chart-box"><canvas id="priceChart"></canvas></div>
  </div>

  <div class="panel">
    <h2>每日涨跌</h2>
    <div class="chart-box" style="height: 260px;"><canvas id="deltaChart"></canvas></div>
  </div>

  <div class="panel">
    <h2>价格明细</h2>
    <div class="table-box">
      <table>
        <thead>
          <tr><th>日期</th><th>G92#</th><th>92# 涨跌</th><th>G95#</th><th>95# 涨跌</th><th>价差</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="note">
      说明：日期以消息发送日期为准。原消息中 10/06 标注为「10.5」、10/07 标注为「10.6」、10/29 标注为「10.28」，均按发送日期归档。
      10/09、10/24、10/31 无汽油报价。
    </div>
  </div>
</div>

<script>
const data = [
  ["10-03", 8200, 8250],
  ["10-04", 8100, 8150],
  ["10-05", 8050, 8100],
  ["10-06", 8030, 8080],
  ["10-07", 7980, 8030],
  ["10-08", 7980, 8030],
  ["10-10", 8030, 8080],
  ["10-11", 8000, 8050],
  ["10-12", 7950, 8000],
  ["10-13", 7930, 7980],
  ["10-14", 7900, 7950],
  ["10-15", 7900, 7950],
  ["10-16", 7860, 7910],
  ["10-17", 7930, 7980],
  ["10-18", 7930, 7980],
  ["10-19", 7880, 7930],
  ["10-20", 7850, 7900],
  ["10-21", 7850, 7900],
  ["10-22", 7830, 7880],
  ["10-23", 7890, 7940],
  ["10-25", 7900, 7950],
  ["10-26", 7840, 7890],
  ["10-27", 7810, 7860],
  ["10-28", 7790, 7840],
  ["10-29", 7840, 7890],
  ["10-30", 7890, 7940],
  ["11-01", 7940, 7990],
  ["11-02", 7910, 7960],
  ["11-03", 7830, 7880],
  ["11-04", 7800, 7850],
  ["11-05", 7750, 7800],
  ["11-06", 7750, 7800],
  ["11-07", 7730, 7780],
  ["11-08", 7610, 7660],
  ["11-09", 7490, 7540],
  ["11-10", 7390, 7440],
  ["11-11", 7270, 7320],
];

const labels = data.map(d => d[0].replace("-", "/"));
const g92 = data.map(d => d[1]);
const g95 = data.map(d => d[2]);
const d92 = g92.map((v, i) => (i === 0 ? 0 : v - g92[i - 1]));
const d95 = g95.map((v, i) => (i === 0 ? 0 : v - g95[i - 1]));

const fmtDelta = v => (v > 0 ? `+${v}` : `${v}`);
const cls = v => (v > 0 ? "up" : v < 0 ? "down" : "");

function renderCards() {
  const last = data.length - 1;
  const totalPct = v => ((v[last] - v[0]) / v[0] * 100).toFixed(2);
  const cards = [
    { label: "G92# 最新", value: g92[last], delta: d92[last], extra: "较前一报价" },
    { label: "G95# 最新", value: g95[last], delta: d95[last], extra: "较前一报价" },
    { label: "G92# 区间涨跌", value: fmtDelta(g92[last] - g92[0]), delta: null, extra: `${totalPct(g92)}%`, raw: g92[last] - g92[0] },
    { label: "G92# 区间高 / 低", value: `${Math.max(...g92)} / ${Math.min(...g92)}`, delta: null, extra: `振幅 ${Math.max(...g92) - Math.min(...g92)}` },
  ];
  document.getElementById("cards").innerHTML = cards.map(c => `
    <div class="card">
      <div class="label">${c.label}</div>
      <div class="value ${c.raw !== undefined ? cls(c.raw) : ""}">${c.value}</div>
      <div class="delta ${c.delta !== null ? cls(c.delta) : ""}">
        ${c.delta !== null ? fmtDelta(c.delta) + " " : ""}${c.extra}
      </div>
    </div>`).join("");
}

function renderTable() {
  const rows = data.map((d, i) => `
    <tr>
      <td>2026/${labels[i]}</td>
      <td>${g92[i]}</td>
      <td class="${cls(d92[i])}">${i === 0 ? "-" : fmtDelta(d92[i])}</td>
      <td>${g95[i]}</td>
      <td class="${cls(d95[i])}">${i === 0 ? "-" : fmtDelta(d95[i])}</td>
      <td>${g95[i] - g92[i]}</td>
    </tr>`).reverse();
  document.getElementById("tbody").innerHTML = rows.join("");
}

function renderCharts() {
  new Chart(document.getElementById("priceChart"), {
    type: "line",
    data: {
      labels,
      datasets: [
        { label: "G92#", data: g92, borderColor: "#3b82f6", backgroundColor: "rgba(59,130,246,.08)", fill: true, tension: .25, pointRadius: 3, pointHoverRadius: 6 },
        { label: "G95#", data: g95, borderColor: "#f97316", backgroundColor: "rgba(249,115,22,.06)", fill: false, tension: .25, pointRadius: 3, pointHoverRadius: 6 },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { position: "top", align: "end" },
        tooltip: {
          callbacks: {
            label: ctx => {
              const delta = ctx.datasetIndex === 0 ? d92[ctx.dataIndex] : d95[ctx.dataIndex];
              return `${ctx.dataset.label}: ${ctx.parsed.y} 元/吨 (${fmtDelta(delta)})`;
            },
          },
        },
      },
      scales: {
        y: { title: { display: true, text: "元/吨" }, grid: { color: "#f0f1f3" } },
        x: { grid: { display: false } },
      },
    },
  });

  new Chart(document.getElementById("deltaChart"), {
    type: "bar",
    data: {
      labels,
      datasets: [{
        label: "G92# 日涨跌 (95# 同步)",
        data: d92,
        backgroundColor: d92.map(v => (v > 0 ? "#e5484d" : v < 0 ? "#30a46c" : "#c9ccd1")),
        borderRadius: 3,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => `涨跌: ${fmtDelta(ctx.parsed.y)} 元/吨` } },
      },
      scales: {
        y: { title: { display: true, text: "元/吨" }, grid: { color: "#f0f1f3" } },
        x: { grid: { display: false } },
      },
    },
  });
}

renderCards();
renderTable();
renderCharts();
</script>
</body>
</html>
